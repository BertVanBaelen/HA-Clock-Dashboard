# Fails when a pushed version tag does not match the versions in the add-on (TR-QLT-07).
name: Tag check

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-versions.sh "$GITHUB_REF_NAME"
