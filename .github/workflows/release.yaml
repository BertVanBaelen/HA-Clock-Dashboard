# Releases a new add-on version (TR-PLT-10):
#   1. tests, 2. builds and pushes the images for every architecture to GHCR,
#   3. only then commits the version bump to main, tags v<version> and creates the GitHub release.
# The Add-on Store offers an update only after step 3, so the images always exist when it does.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bertvanbaelen/alarm-actions
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: alarm_actions
        run: |
          bash ../scripts/set-version.sh "$VERSION"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run typecheck
          npm run lint
          npm test

  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/set-version.sh "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: alarm_actions
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}-${{ matrix.arch }}:${{ env.VERSION }}
            ${{ env.IMAGE }}-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Alarm Actions
            io.hass.description=Alarm planner that runs Home Assistant scripts
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump version, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/set-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm_actions
          if git diff --cached --quiet; then
            echo "Version already $VERSION in the repository"
          else
            git commit -m "Release $VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Alarm Actions $VERSION" --generate-notes
