# Releases a new add-on version (TR-PLT-10):
#   1. tests, 2. builds and signs the Android APK, 3. builds and pushes the images of both add-ons
#   (the app add-on with the APK inside) for every architecture to GHCR,
#   4. only then commits the version bump to main, tags v<version> and creates the GitHub release
#   with the APK and its SHA-256 attached.
# Needs the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (the release fails without them: an unsigned APK cannot be installed).
# The Add-on Store offers an update only after step 3, so the images always exist when it does.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.2.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bertvanbaelen/alarm-actions
  APP_IMAGE: ghcr.io/bertvanbaelen/alarm-actions-app
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: alarm_actions
        run: |
          bash ../scripts/set-version.sh "$VERSION"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run typecheck
          npm run lint
          npm test

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/set-version.sh "$VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0 platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)"; exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PappVersion="$VERSION"
          rm -f "$ANDROID_KEYSTORE_FILE"
          apk=app/build/outputs/apk/release/app-release.apk
          buildtools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$buildtools/apksigner" verify --print-certs "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/alarm-actions-$VERSION.apk"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "alarm-actions-$VERSION.apk" > "alarm-actions-$VERSION.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/
          retention-days: 7

  build:
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/set-version.sh "$VERSION"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: alarm_actions
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}-${{ matrix.arch }}:${{ env.VERSION }}
            ${{ env.IMAGE }}-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Alarm Actions
            io.hass.description=Alarm planner that runs Home Assistant scripts
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  build-app:
    needs: apk
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/set-version.sh "$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - run: cp "dist/alarm-actions-$VERSION.apk" alarm_actions_app/alarm_actions.apk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: alarm_actions_app
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.APP_IMAGE }}-${{ matrix.arch }}:${{ env.VERSION }}
            ${{ env.APP_IMAGE }}-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Alarm Actions App
            io.hass.description=Android app for Alarm Actions
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}

  release:
    needs: [build, build-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - name: Bump version, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/set-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alarm_actions alarm_actions_app
          if git diff --cached --quiet; then
            echo "Version already $VERSION in the repository"
          else
            git commit -m "Release $VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Alarm Actions $VERSION" --generate-notes \
            "dist/alarm-actions-$VERSION.apk" "dist/alarm-actions-$VERSION.apk.sha256"
