# Home Assistant add-on definition (repository: https://github.com/BertVanBaelen/HA-Clock-Dashboard).
# The version is bumped by the release workflow (.github/workflows/release.yaml) after the images
# for that version are on GHCR; keep it equal to APP_VERSION in server/src/version.ts.
name: Alarm Actions
version: "0.3.0"
slug: alarm_actions
description: Alarm planner that runs Home Assistant scripts before, at or after your alarms
url: https://github.com/BertVanBaelen/HA-Clock-Dashboard
# Prebuilt by GitHub Actions; users never build the image locally.
image: ghcr.io/bertvanbaelen/alarm-actions-{arch}
arch:
  - aarch64
  - amd64
homeassistant: "2024.4.0"
# startup application, boot auto, ingress_port 8099 and backup hot are the defaults.
# Health is checked by the Dockerfile HEALTHCHECK (the watchdog option is obsolete).
init: false
ingress: true
panel_icon: mdi:alarm
panel_title: Alarms
panel_admin: false
homeassistant_api: true
# Supervisor API, only to read Core's port and SSL setting (GET /core/info) for app token checks.
hassio_api: true
# Optional external API for the Android app (phase 6); not mapped on the host by default.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: External API for the Android app (only when external_api_url is set)
backup_pre: /usr/local/bin/alarm-actions-backup
backup_exclude:
  - alarm_actions.db
  - alarm_actions.db-wal
  - alarm_actions.db-shm
options:
  snooze_minutes: 9
  dismiss_timeout_minutes: 60
  grace_period_minutes: 5
  history_days: 30
  history_max: 200
  max_script_starts_per_minute: 20
  min_script_interval_seconds: 30
  log_level: info
schema:
  snooze_minutes: int(1,30)
  dismiss_timeout_minutes: int(5,240)
  grace_period_minutes: int(1,60)
  history_days: int(1,365)
  history_max: int(10,2000)
  max_script_starts_per_minute: int(1,200)
  min_script_interval_seconds: int(0,3600)
  log_level: list(trace|debug|info|warning|error|fatal)
  external_api_url: url?
