openapi: 3.1.0
info:
  title: Alarm Actions API
  version: '1'
  summary: REST API of the Alarm Actions add-on.
  description: |
    Served under `/api/v1` on two listeners; there are no routes without login.

    - **Ingress** (the panel): every request must arrive through the Supervisor ingress proxy,
      which sets the `X-Remote-User-Id` header.
    - **External** (the Android app, only when `external_api_url` is set): port 8100, below the
      path of `external_api_url` (for example `https://api.example.com/clock/api/v1`). Every
      request needs `Authorization: Bearer <Home Assistant access token>`; the add-on checks the
      token with Home Assistant (cached 60 s; failed checks are rate limited per address).
      `X-Remote-User-*` headers are ignored. Responses carry `Cache-Control: no-store`.

    - Every user (also administrators) sees and changes only their own alarms; other users'
      alarms behave as not found (404).
    - `GET /planned` shows every user the upcoming actions of other users' alarms (who, which
      script, when), without the alarms themselves.
    - Unknown fields in request bodies are rejected (400).
    - Requests without a body must not send `Content-Type: application/json`.
    - Rate limit: 120 requests per minute per user (429 with `Retry-After`).
servers:
  - url: /api/v1
    description: Ingress (panel)
  - url: '{external_api_url}/api/v1'
    description: External API for the app
    variables:
      external_api_url:
        default: https://api.example.com/clock
security:
  - ingress: []
  - bearer: []
tags:
  - name: general
  - name: alarms
  - name: app
paths:
  /info:
    get:
      tags: [general]
      operationId: getInfo
      responses:
        '200':
          description: Add-on information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Info' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      tags: [general]
      operationId: getMe
      responses:
        '200':
          description: The current Home Assistant user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /actions:
    get:
      tags: [general]
      operationId: listActions
      description: Scripts carrying the action label (`alarm_action`), sorted by name.
      responses:
        '200':
          description: Usable scripts.
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/ActionDefinition' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /app/info:
    get:
      tags: [general]
      operationId: getAppInfo
      description: >-
        Whether the app add-on is running, which APK it offers (TR-APP-03) and the addresses the
        app is set up with (TR-API-14). The app uses `version_code` for its update check.
      responses:
        '200':
          description: App availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppInfo' }
        default: { $ref: '#/components/responses/Error' }
  /app/apk:
    get:
      tags: [app]
      operationId: downloadApk
      description: The signed APK, streamed from the app add-on (FR-APP-05, SEC-09).
      responses:
        '200':
          description: The APK (`Content-Disposition` attachment).
          content:
            application/vnd.android.package-archive:
              schema: { type: string, format: binary }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /sync:
    get:
      tags: [app]
      operationId: sync
      description: |
        Own alarms changed since the cursor, plus deleted ones (FR-APP-03, TR-APP-07). Without
        `since` (or `since=0`), or with a cursor that is too old or unknown, the answer is a full
        list (`full: true`) that replaces the local copy.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, pattern: '^\d{1,15}$', default: '0' }
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        default: { $ref: '#/components/responses/Error' }
  /clients:
    get:
      tags: [app]
      operationId: listClients
      responses:
        '200':
          description: The user's phones, most recently seen first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientsResponse' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [app]
      operationId: registerClient
      description: |
        Registers or updates the phone (FR-APP-04); the app calls it on every sync. The time zone
        drives away detection (FR-EXE-12). At 10 phones per user the longest unseen one is removed.
        404 when the id belongs to another user (generate a new id).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: The phone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Client' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /clients/{clientId}:
    delete:
      tags: [app]
      operationId: removeClient
      description: Removes one of the user's phones from the list; does not revoke its login.
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /settings:
    get:
      tags: [general]
      operationId: getSettings
      description: Read-only; settings are changed on the add-on configuration page.
      responses:
        '200':
          description: Global settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        default: { $ref: '#/components/responses/Error' }
  /alarms:
    get:
      tags: [alarms]
      operationId: listAlarms
      description: Own alarms only.
      responses:
        '200':
          description: Alarms.
          content:
            application/json:
              schema:
                type: object
                required: [alarms]
                properties:
                  alarms:
                    type: array
                    items: { $ref: '#/components/schemas/Alarm' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [alarms]
      operationId: createAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmSaveResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /planned:
    get:
      tags: [alarms]
      operationId: listPlanned
      description: >-
        Upcoming actions of other users' enabled alarms (next occurrence only, enabled actions,
        not yet run), sorted by time. `after_dismiss` actions have no fixed time and sort by
        alarm time plus delay.
      responses:
        '200':
          description: Planned actions.
          content:
            application/json:
              schema:
                type: object
                required: [planned]
                properties:
                  planned:
                    type: array
                    items: { $ref: '#/components/schemas/PlannedAction' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    get:
      tags: [alarms]
      operationId: getAlarm
      responses:
        '200':
          description: The alarm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [alarms]
      operationId: updateAlarm
      description: |
        Replaces the alarm. `revision` must equal the stored revision, otherwise 409 with
        `current_revision`. Actions keep their `id` when it is sent back; new actions get one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmSaveResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [alarms]
      operationId: deleteAlarm
      responses:
        '204':
          description: Deleted.
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/skip:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    post:
      tags: [alarms]
      operationId: skipAlarm
      description: Skips the next occurrence of a repeating alarm. No request body.
      responses:
        '200':
          description: The updated alarm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/unskip:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
    post:
      tags: [alarms]
      operationId: unskipAlarm
      description: Cancels a skip. No request body.
      responses:
        '200':
          description: The updated alarm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/occurrences/{occurrenceId}/dismissed:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
      - $ref: '#/components/parameters/OccurrenceId'
    post:
      tags: [alarms]
      operationId: reportDismissed
      description: |
        The alarm was dismissed (FR-EVT-01). Owner only; from the app or the panel. Up to 60 min
        before the alarm time this is an early dismissal: the before/at/after actions of that
        occurrence are skipped and it does not ring. `after_dismiss` actions run at the dismissal
        time plus their delay. After `dismiss_timeout_minutes` the occurrence expires instead.
        Fires the HA event `alarm_actions_alarm_dismissed`. Idempotent per occurrence.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccurrenceEventInput' }
      responses:
        '200':
          description: 'Recorded (or already recorded, `duplicate: true`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccurrenceEventResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/occurrences/{occurrenceId}/snoozed:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
      - $ref: '#/components/parameters/OccurrenceId'
    post:
      tags: [alarms]
      operationId: reportSnoozed
      description: |
        The alarm was snoozed (FR-EVT-02). Fires `alarm_actions_alarm_snoozed`. Not before the
        alarm time (2 min clock tolerance).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccurrenceEventInput' }
      responses:
        '200':
          description: 'Recorded (or already recorded, `duplicate: true`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccurrenceEventResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/occurrences/{occurrenceId}/timed_out:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
      - $ref: '#/components/parameters/OccurrenceId'
    post:
      tags: [alarms]
      operationId: reportTimedOut
      description: |
        Nobody dismissed the alarm on the phone in time (FR-EVT-03): the occurrence expires and its
        `after_dismiss` actions do not run.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccurrenceEventInput' }
      responses:
        '200':
          description: 'Recorded (or already recorded, `duplicate: true`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccurrenceEventResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /alarms/{id}/actions/{actionId}/run:
    parameters:
      - $ref: '#/components/parameters/AlarmId'
      - name: actionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [alarms]
      operationId: runAction
      description: |
        Starts the action's script now ("run now", FR-EXE-08). Same checks and limits as a planned
        run; the result is stored in the history. Owner only. No request body.
      responses:
        '200':
          description: Result of the start.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunNowResponse' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    ingress:
      type: apiKey
      in: header
      name: X-Remote-User-Id
      description: Set by the Home Assistant Supervisor ingress proxy; not usable from outside.
    bearer:
      type: http
      scheme: bearer
      description: Home Assistant access token (external listener only).
  parameters:
    AlarmId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OccurrenceId:
      name: occurrenceId
      in: path
      required: true
      description: '`<alarm id>_<scheduled time as YYYYMMDDTHHMMSSZ>`, as in `current_occurrence.id`.'
      schema: { type: string, maxLength: 100, examples: ['5f0c..._20261014T103000Z'] }
  responses:
    Error:
      description: |
        Error. Codes: `invalid_input` / `bad_request` (400), `unauthorized` (401), `forbidden` (403),
        `not_found` (404), `conflict` (409, with `current_revision`), `payload_too_large` (413),
        `unsupported_media_type` (415), `limit_reached` / `script_unavailable` /
        `not_repeating` / `invalid_occurrence` / `implausible_time` / `occurrence_skipped` (422),
        `rate_limited` (429), `internal_error` (500),
        `service_unavailable` (503).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    RunNowResponse:
      type: object
      required: [result, reason]
      properties:
        result:
          type: string
          enum: [success, failed, skipped, unavailable]
        reason: { type: [string, 'null'] }
      additionalProperties: false
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        current_revision: { type: integer }
        script_entity_id: { type: string }
      additionalProperties: true
    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    Timing:
      type: string
      enum: [before, at, after, after_dismiss]
    Info:
      type: object
      required: [name, version, api_version, min_client_api_version, time_zone, ha_connected, app_available]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: integer }
        min_client_api_version: { type: integer }
        time_zone: { type: [string, 'null'] }
        ha_connected: { type: boolean }
        app_available: { type: boolean }
    Me:
      type: object
      required: [id, name, away]
      properties:
        id: { type: string }
        name: { type: string }
        away: { type: boolean }
    ActionDefinition:
      type: object
      required: [entity_id, name, icon, icon_path, description]
      properties:
        entity_id: { type: string, examples: [script.coffee] }
        name: { type: string }
        icon: { type: [string, 'null'] }
        icon_path:
          type: [string, 'null']
          description: SVG path data (24×24 viewBox) of the MDI icon, resolved by the add-on; null when the icon is unknown.
        description: { type: [string, 'null'] }
    AppInfo:
      type: object
      required: [available, version, version_code, sha256, size, ha_url, api_url]
      properties:
        available: { type: boolean }
        version: { type: [string, 'null'] }
        version_code: { type: [integer, 'null'], description: 'Android versionCode (major*1000000 + minor*1000 + patch).' }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        size: { type: [integer, 'null'], description: Bytes. }
        ha_url: { type: [string, 'null'], description: HA external URL (login). }
        api_url: { type: [string, 'null'], description: The `external_api_url` option. }
    SyncResponse:
      type: object
      required: [change_seq, full, alarms, deleted, time_zone, snooze_minutes, dismiss_timeout_minutes, away]
      properties:
        change_seq: { type: integer, description: Send as `since` next time. }
        full: { type: boolean, description: True when `alarms` is the complete list. }
        alarms:
          type: array
          items: { $ref: '#/components/schemas/Alarm' }
        deleted:
          type: array
          items: { type: string, format: uuid }
        time_zone: { type: [string, 'null'] }
        snooze_minutes: { type: integer }
        dismiss_timeout_minutes: { type: integer }
        away: { type: boolean }
    ClientInput:
      type: object
      additionalProperties: false
      required: [id, name, app_version, time_zone, last_sync_seq]
      properties:
        id: { type: string, format: uuid, description: Generated by the app once per install. }
        name: { type: string, minLength: 1, maxLength: 100 }
        app_version: { type: string, minLength: 1, maxLength: 40 }
        time_zone: { type: string, maxLength: 64, examples: [Europe/Brussels] }
        last_sync_seq: { type: integer, minimum: 0 }
    Client:
      type: object
      required: [id, name, app_version, time_zone, last_sync_seq, last_seen_at, away]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        app_version: { type: string }
        time_zone: { type: string }
        last_sync_seq: { type: integer }
        last_seen_at: { type: string, format: date-time }
        away: { type: boolean }
    ClientsResponse:
      type: object
      required: [clients, away]
      properties:
        clients:
          type: array
          items: { $ref: '#/components/schemas/Client' }
        away: { type: boolean }
    CurrentOccurrence:
      type: object
      required: [id, scheduled_at, status]
      description: |
        The occurrence that can be dismissed now: ringing (`fired` / `snoozed`, until the
        dismissal timeout), already dismissed early (`dismissed`: the phone must not ring it), or
        `pending` from 60 minutes before the alarm.
      properties:
        id: { type: string }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, fired, snoozed, dismissed] }
    OccurrenceEventInput:
      type: [object, 'null']
      additionalProperties: false
      properties:
        occurred_at:
          type: string
          format: date-time
          description: When it happened on the phone (with offset); default now. Later than now + 2 min is rejected.
    OccurrenceEventResponse:
      type: object
      required: [occurrence_id, type, status, duplicate]
      properties:
        occurrence_id: { type: string }
        type: { type: string, enum: [dismissed, snoozed, timed_out] }
        status: { type: string, enum: [pending, fired, snoozed, dismissed, expired, skipped] }
        duplicate: { type: boolean }
    Settings:
      type: object
      required:
        - snooze_minutes
        - dismiss_timeout_minutes
        - grace_period_minutes
        - action_label
        - history_days
        - history_max
        - max_script_starts_per_minute
        - min_script_interval_seconds
        - log_level
        - external_api_url
      properties:
        snooze_minutes: { type: integer }
        dismiss_timeout_minutes: { type: integer }
        grace_period_minutes: { type: integer }
        action_label: { type: string }
        history_days: { type: integer }
        history_max: { type: integer }
        max_script_starts_per_minute: { type: integer }
        min_script_interval_seconds: { type: integer }
        log_level: { type: string, enum: [trace, debug, info, warning, error, fatal] }
        external_api_url: { type: [string, 'null'] }
    AlarmAction:
      type: object
      required: [id, script_entity_id, timing, offset_minutes, delay_minutes, enabled]
      properties:
        id: { type: string, format: uuid }
        script_entity_id: { type: string }
        timing: { $ref: '#/components/schemas/Timing' }
        offset_minutes: { type: [integer, 'null'] }
        delay_minutes: { type: [integer, 'null'] }
        enabled: { type: boolean }
    AlarmActionInput:
      type: object
      additionalProperties: false
      required: [script_entity_id, timing]
      description: |
        `offset_minutes` is required for `before` / `after` and not allowed otherwise.
        `delay_minutes` is only allowed for `after_dismiss` (default 0).
      properties:
        id: { type: string, format: uuid, description: Send back to keep the action's identity. }
        script_entity_id: { type: string, pattern: '^script\.[a-z0-9_]+$', maxLength: 255 }
        timing: { $ref: '#/components/schemas/Timing' }
        offset_minutes: { type: [integer, 'null'], minimum: 1, maximum: 720 }
        delay_minutes: { type: [integer, 'null'], minimum: 0, maximum: 120 }
        enabled: { type: boolean, default: true }
    AlarmCreate:
      allOf:
        - $ref: '#/components/schemas/AlarmFields'
      unevaluatedProperties: false
    AlarmUpdate:
      allOf:
        - $ref: '#/components/schemas/AlarmFields'
      type: object
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
      unevaluatedProperties: false
    AlarmFields:
      type: object
      required: [time]
      properties:
        label: { type: string, maxLength: 100, default: '' }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['06:30'] }
        repeat_days:
          type: array
          maxItems: 7
          uniqueItems: true
          default: []
          description: Empty for a one-time alarm.
          items: { $ref: '#/components/schemas/Weekday' }
        enabled: { type: boolean, default: true }
        snooze_minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 30
          default: null
          description: Null uses the global setting.
        actions:
          type: array
          maxItems: 20
          default: []
          items: { $ref: '#/components/schemas/AlarmActionInput' }
    Alarm:
      type: object
      required:
        - id
        - owner_user_id
        - owner_name
        - label
        - time
        - repeat_days
        - enabled
        - skip_next
        - snooze_minutes
        - actions
        - revision
        - change_seq
        - created_at
        - updated_at
        - next_occurrence
        - disabled_reason
        - current_occurrence
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string }
        owner_name: { type: [string, 'null'] }
        label: { type: string }
        time: { type: string }
        repeat_days:
          type: array
          items: { $ref: '#/components/schemas/Weekday' }
        enabled: { type: boolean }
        skip_next: { type: boolean }
        snooze_minutes: { type: [integer, 'null'] }
        actions:
          type: array
          items: { $ref: '#/components/schemas/AlarmAction' }
        revision: { type: integer }
        change_seq: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        next_occurrence:
          type: [string, 'null']
          format: date-time
          description: Next time the alarm rings (UTC), null when disabled.
        disabled_reason:
          type: [string, 'null']
          enum: [owner_inactive, fired, null]
        current_occurrence:
          oneOf:
            - $ref: '#/components/schemas/CurrentOccurrence'
            - type: 'null'
    PlannedAction:
      type: object
      required: [owner_name, script_entity_id, script_name, icon_path, timing, run_at, alarm_at, delay_minutes]
      properties:
        owner_name: { type: [string, 'null'] }
        script_entity_id: { type: string }
        script_name:
          type: [string, 'null']
          description: Null when the script is gone or lost its label.
        icon_path: { type: [string, 'null'] }
        timing: { $ref: '#/components/schemas/Timing' }
        run_at:
          type: [string, 'null']
          format: date-time
          description: When the action runs (UTC); null for `after_dismiss`.
        alarm_at: { type: string, format: date-time, description: When the alarm rings (UTC). }
        delay_minutes: { type: [integer, 'null'] }
    AlarmWarning:
      type: object
      required: [code, alarm_action_id, message]
      properties:
        code: { type: string, enum: [before_missed] }
        alarm_action_id: { type: string, format: uuid }
        message: { type: string }
    AlarmSaveResponse:
      type: object
      required: [alarm, warnings]
      properties:
        alarm: { $ref: '#/components/schemas/Alarm' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AlarmWarning' }
