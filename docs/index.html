<!doctype html>
<!--
  OAuth client page for the Alarm Actions Android app (served by GitHub Pages from /docs).

  and only accepts the redirect_uri listed in the link element below.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm Actions</title>
  <link rel="redirect_uri" href="alarmactions://auth-callback">
</head>
<body>
  <h1>Alarm Actions</h1>
  <p>Alarm planner for Home Assistant that runs scripts around your alarms, with an Android app that rings them.</p>
  <p>See <a href="https://github.com/BertVanBaelen/HA-Clock-Dashboard">the repository</a> for installation and documentation.</p>
</body>
</html>
